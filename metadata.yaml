abstract: 'Contemporary political and moral thought treats the Person, the autonomous, rational, rights-bearing
  individual, as a natural category. We treat it as a stratification: a composite assembled over millennia
  from at least five historical formations, each built by specific institutions to answer a specific problem.
  Relational personhood, rooted in kinship, ritual, and animism, settles who may be recognized. Epic singularization
  in *Gilgamesh* and the *Odyssey* makes a single life narratable. Roman law defines the *persona* as
  a bearer of rights and liabilities. Paul, Augustine, and Boethius add an interior conscience answerable
  before God and a metaphysical definition of the person. Locke and Kant consolidate the autonomous rational
  subject that generates moral law from within. The modern individual appears when these layers are fused
  and retroactively treated as one thing; Hegel''s theory of recognition socializes the figure and Foucault''s
  genealogy historicizes it. Contemporary platform capitalism, algorithmic management, the extension of
  legal personhood to non-human entities, and neurotechnology thin the practical conditions of agency
  while leaving formal personhood intact. Three small models make parts of the argument auditable. Dating
  the nine formations reproduces the narrative order over a literate span of 4,075 years. A geometric-mean
  index with formal support fixed at 1.00 gives a profiled human a practical index of 0.39 and an infrastructural
  human 0.93. In a recognition network, concentrating recognition on six of 120 agents leaves profiled
  agents with 0.36 reciprocated ties against 9.5 for the minority. Personhood, having been assembled,
  can be disassembled; today the disassembly proceeds by hollowing institutional supports while the legal
  category stays in place.'
web_blurb: 'The modern Person is a composite of five historical formations: kinship, epic, Roman law,
  Christian conscience and Kantian autonomy. Today its practical supports thin unequally while formal
  legal personhood stays intact.'
