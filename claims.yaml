- id: russo-simon
  kind: source
  passage: Joseph Russo and Bennett Simon explained the distinctive Homeric representation of mental life as a product
    of oral epic composition, without concluding from it that Homeric people lacked a unified mind [@russo1968].
  evidence:
    citation_id: russo1968
    locator: pp. 483-484
    verified: true
    verification_note: 'Opening text of DOI 10.2307/2708290 (via OpenAlex): the paper proposes a framework explaining
      the Homeric modes of representing mental life as a concomitant of oral epic composition, engaging Snell''s
      thesis about the Homeric conception of man.'
- id: thesis
  kind: interpretation
  passage: 'We treat it as a stratification: a composite assembled over millennia from at least five historical
    formations, each built by specific institutions to answer a specific problem.'
  rationale: 'Central thesis: the Person is a composite of historically distinct formations; argued genealogically,
    not derived from the models.'
- id: def-index
  kind: definition
  passage: The personhood index is the geometric mean of the layer supports.
  rationale: Defines the composite index; the geometric mean encodes the claim that one near-zero layer cannot be
    compensated.
- id: assume-stipulated
  kind: assumption
  passage: The support values are stipulated, so the model inherits the asymmetry from the claims of section 8 and
    does not discover it.
  rationale: The index model inherits the asymmetry from stipulated supports; it checks composition, not magnitude.
- id: assume-dates
  kind: assumption
  passage: The dates are representative onsets chosen from the cited works, and the gaps inherit their imprecision.
  rationale: Dating is representative; gaps inherit the imprecision of the onsets.
- id: interp-reciprocity
  kind: interpretation
  passage: What most agents lose is reciprocity, which on the Hegelian account is what makes recognition constitutive
    of a self and distinguishes it from registration.
  rationale: Hegelian reading of the recognition-network result.
- id: interp-legal
  kind: interpretation
  passage: Legal personhood was never a natural kind; it was always an institutional assignment, a decision by a
    political authority about who or what would count as a bearer of rights and obligations.
  rationale: Interpretation of the expansion of legal personhood to non-human entities.
runs:
- id: model
  required: true
